plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
group = 'dev.legacybridge.validation'
version = '1.0.0'
base.archivesName = 'legacybridge-composition-probe-1.20.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
sourceSets {
    main.java.srcDir '../composition-probe-common/src/main/java'
    test.java.srcDir '../composition-probe-common/src/test/java'
}
minecraft { mappings channel: 'official', version: '1.20.1' }
repositories { mavenCentral() }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.23'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('jar', Jar) {
    manifest.attributes('Implementation-Title': 'LegacyBridge Composition QA 1.20.1',
        'Implementation-Version': project.version, 'Implementation-Vendor': 'LegacyBridge contributors')
    finalizedBy 'reobfJar'
}
tasks.named('test', Test) {
    useJUnitPlatform()
    dependsOn 'reobfJar'
    maxHeapSize = '256m'
    systemProperty 'probe.jar', tasks.named('jar', Jar).get().archiveFile.get().asFile.absolutePath
    systemProperty 'probe.expectedMajor', '61'
    systemProperty 'probe.minecraft', '1.20.1'
    systemProperty 'probe.forge', '47.4.23'
    testLogging { events 'passed', 'failed', 'skipped'; exceptionFormat 'full' }
}
