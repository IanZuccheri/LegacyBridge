plugins { id 'java'; id 'net.minecraftforge.gradle' version '6.0.54' }
group = 'dev.legacybridge.fixture'
version = '1.0.0'
base.archivesName = 'legacybridge-lifecycle-suite-1.16.5'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 8 }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
minecraft { mappings channel: 'official', version: '1.16.5' }
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.16.5-36.2.42' }
tasks.named('jar', Jar) {
    manifest.attributes('Implementation-Title': 'LegacyBridge Lifecycle Suite Fixture',
        'Implementation-Version': project.version, 'Implementation-Vendor': 'LegacyBridge contributors',
        'LegacyBridge-Fixture': 'lifecycle-suite-static-candidate')
    finalizedBy 'reobfJar'
}
