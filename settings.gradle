pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        mavenCentral()
    }
}

rootProject.name = 'LegacyBridge'

include 'legacy-converter'
include 'legacy-compat-api'
include 'legacy-runtime'
include 'legacy-workflow'
include 'legacy-product'
// Development-only corpus verification; never bundled in LegacyBridge.jar.
include 'legacy-corpus'
